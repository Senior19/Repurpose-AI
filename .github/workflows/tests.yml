name: Backend tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/repurposeai/backend
    steps:
      - name: Run tests
        working-directory: repurposeai/backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repurposeai/backend/requirements*.txt

      - name: Install dependencies
        working-directory: repurposeai/backend
        run: pip install -r requirements-dev.txt

      - name: Compile Python files
        working-directory: repurposeai/backend
        run: python -m compileall -q .

      - name: Run tests
        working-directory: repurposeai/backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q
